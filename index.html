<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d2125"><title>Demandas · José Klak</title><link rel="stylesheet" href="styles.css"></head>
<body>
<section id="gate" class="gate"><form id="login" class="login"><div class="brand">▥ Demandas</div><h1 id="gate-title">Seu quadro, do seu jeito.</h1><p id="gate-copy"></p><label>Senha<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><label id="confirm-label">Confirme a senha<input id="confirm-password" type="password" minlength="8" autocomplete="new-password"></label><button class="primary" id="login-button">Entrar</button><p id="login-error" role="alert"></p><small>Os dados ficam criptografados neste navegador. Guarde sua senha e exporte backups: não há recuperação de senha ou sincronização automática entre aparelhos.</small><button type="button" id="gate-restore">Restaurar backup neste aparelho</button></form></section>
<div id="app" hidden>
<header><a class="brand" href="#">▥ Demandas</a><div class="search"><input id="search" placeholder="Pesquisar cartões e atividades" aria-label="Pesquisar"></div><button id="lock" title="Bloquear quadro">Sair <span class="avatar">JK</span></button></header>
<nav class="boardbar"><strong>DEMANDAS</strong><span class="private">Pessoal</span><div class="navlinks"><button data-view="board" class="selected">▥ Quadro</button><button data-view="reports">◷ Relatórios</button><button data-view="factories">⌂ Fábricas</button><button data-view="tools">⚙ Ferramentas</button></div></nav>
<main id="main"></main><footer><span id="save-status" role="status">Salvo neste navegador</span><span>José Klak · Dados locais</span></footer>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status"></div><input type="file" id="file" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body></html>
